services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chat-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webui_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_strong_database_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-openwebui}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webui_user} -d ${POSTGRES_DB:-openwebui}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: always
    # Holds Open WebUI's session-revocation list. When the identity provider signs a user out
    # (OIDC back-channel logout) Open WebUI records it here so that user's tokens stop working
    # immediately, in every browser. The append-only file keeps the list across restarts, so a
    # signed-out session cannot come back to life when this container restarts. Not published on
    # the host: only reachable from the compose network.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    networks:
      - academic-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  open-webui:
    # Derived from ghcr.io/open-webui/open-webui:main by Dockerfile.webui, which
    # bakes in the G-CAT branding and the auth.gcat.ir logout patch. Build with:
    #   docker build -f Dockerfile.webui -t gcat/open-webui:custom .
    image: gcat/open-webui:custom
    container_name: chat-webui
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-webui_user}:${POSTGRES_PASSWORD:-replace_with_strong_database_password_here}@postgres:5432/${POSTGRES_DB:-openwebui}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - webui_data:/app/backend/data
    networks:
      - academic-net

  caddy:
    image: caddy:2-alpine
    container_name: chat-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - open-webui
    networks:
      - academic-net

volumes:
  postgres_data:
  redis_data:
  webui_data:
  caddy_data:
  caddy_config:

networks:
  academic-net:
    driver: bridge
